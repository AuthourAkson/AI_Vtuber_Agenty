<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live2D Desktop Pet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent !important;
  }
  /* Force WebView2 transparency */
  :root { background: transparent !important; }
  canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
    cursor: grab;
    background: transparent !important;
  }
  canvas:active { cursor: grabbing; }
  /* Chat dialog */
  #chat-dialog {
    display: none;
    position: fixed;
    min-width: 260px; max-width: 400px; max-height: 300px;
    background: rgba(20, 20, 20, 0.85);
    border: 1px solid rgba(76, 175, 80, 0.4);
    border-radius: 12px; padding: 10px;
    color: #ccc; font-family: 'Segoe UI', sans-serif; font-size: 12px;
    z-index: 9999; overflow-y: auto;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  #chat-dialog .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 6px; padding-bottom: 4px;
    border-bottom: 1px solid rgba(255,255,255,0.08); cursor: move;
  }
  #chat-dialog .title { color: #4CAF50; font-weight: 600; font-size: 13px; }
  #chat-dialog .close-btn {
    cursor: pointer; color: #888; font-size: 16px; line-height: 1;
    padding: 2px 6px; border-radius: 4px;
  }
  #chat-dialog .close-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
  #chat-dialog .msg { margin-bottom: 5px; padding: 3px 0; }
  #chat-dialog .msg.user { color: #64B5F6; }
  #chat-dialog .msg.assistant { color: #A5D6A7; }
  #chat-dialog .msg .label { font-size: 10px; opacity: 0.5; margin-bottom: 1px; text-transform: uppercase; }
  #chat-dialog .msg .text { line-height: 1.4; }
</style>
</head>
<body>

<canvas id="live2d-canvas"></canvas>

<div id="chat-dialog">
  <div class="header">
    <span class="title">Live2D Chat</span>
    <span class="close-btn" onclick="closeChatDialog()">✕</span>
  </div>
  <div id="chat-messages"></div>
</div>

<script src="pixi.min.js"></script>
<script src="live2dcubismcore.min.js"></script>
<script src="live2d.min.js"></script>
<script src="cubism4.min.js"></script>

<script>
// ─── Global state ───
let app = null;
let model = null;
let modelReady = false;
let currentModelPath = null;
let modelScale = 0.16;
let modelX = 0.5;
let modelY = 0.5;

// ─── Parse query parameters (must be after var declarations) ───
(function() {
  var params = new URLSearchParams(window.location.search);
  var modelParam = params.get('model');
  if (modelParam) {
    window.__initialModel = decodeURIComponent(modelParam);
  }
  var xParam = params.get('x');
  if (xParam) modelX = parseFloat(xParam) / 100;
  var yParam = params.get('y');
  if (yParam) modelY = parseFloat(yParam) / 100;
  var scaleParam = params.get('scale');
  if (scaleParam) modelScale = parseFloat(scaleParam);
})();

// Drag state
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;
let dragModelStartX = 0;
let dragModelStartY = 0;

// Mouse tracking
let mouseTracking = false;

// Dialog drag
let dialogDragging = false;
let dialogOffX = 0, dialogOffY = 0;

function postToFlutter(type, data) {
  try {
    if (window.flutter_inappwebview) {
      window.flutter_inappwebview.callHandler('onLive2DEvent', JSON.stringify({type: type, data: data || {}}));
    }
  } catch(e) {}
}

function initPixi() {
  if (app) return;
  const canvas = document.getElementById('live2d-canvas');
  const w = window.innerWidth, h = window.innerHeight;

  app = new PIXI.Application({
    view: canvas, width: w, height: h,
    backgroundAlpha: 0, antialias: true,
    resolution: window.devicePixelRatio || 1, autoDensity: true,
  });

  window.addEventListener('resize', () => {
    if (!app) return;
    app.renderer.resize(window.innerWidth, window.innerHeight);
    if (model) updateModelTransform();
  });

  // ─── Mouse tracking for eyes ───
  document.addEventListener('mousemove', (e) => {
    // Eye tracking
    if (mouseTracking && modelReady && model) {
      const w = window.innerWidth, h = window.innerHeight;
      const ox = (e.clientX - w/2) / (w/2);
      const oy = -(e.clientY - h/2) / (h/2);
      try {
        const core = model.internalModel.coreModel;
        core.setParameterValueById('ParamAngleX', ox * 30);
        core.setParameterValueById('ParamAngleY', oy * 30);
        core.setParameterValueById('ParamEyeBallX', ox);
        core.setParameterValueById('ParamEyeBallY', oy);
      } catch(_) {}
    }

    // Model dragging
    if (isDragging && model && app) {
      const dx = e.clientX - dragStartX;
      const dy = e.clientY - dragStartY;
      modelX = (dragModelStartX + dx) / app.renderer.width;
      modelY = (dragModelStartY + dy) / app.renderer.height;
      model.x = dragModelStartX + dx;
      model.y = dragModelStartY + dy;
    }
  });

  // ─── Drag start ───
  canvas.addEventListener('mousedown', (e) => {
    if (!model || !app) return;
    if (e.button !== 0) return; // left click only
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragModelStartX = model.x;
    dragModelStartY = model.y;
    e.preventDefault();
  });

  // ─── Drag end ───
  window.addEventListener('mouseup', (e) => {
    if (!isDragging) return;
    isDragging = false;
    // Report new position to Flutter
    postToFlutter('modelDragged', {
      x: Math.round(modelX * 100),
      y: Math.round(modelY * 100)
    });
  });

  // ─── Right-click dialog ───
  canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    postToFlutter('rightClick', {screenX: e.screenX, screenY: e.screenY});
  });

  // Dialog drag
  const dialog = document.getElementById('chat-dialog');
  const header = dialog.querySelector('.header');
  header.addEventListener('mousedown', (e) => {
    dialogDragging = true;
    dialogOffX = e.clientX - dialog.offsetLeft;
    dialogOffY = e.clientY - dialog.offsetTop;
    e.preventDefault();
  });
  document.addEventListener('mousemove', (e) => {
    if (!dialogDragging) return;
    dialog.style.left = (e.clientX - dialogOffX) + 'px';
    dialog.style.top = (e.clientY - dialogOffY) + 'px';
  });
  document.addEventListener('mouseup', () => { dialogDragging = false; });
}

// ─── Model loading ───
function loadModel(path, scale, xPos, yPos) {
  if (!app) initPixi();

  if (model) {
    try {
      app.stage.removeChild(model);
      model.destroy({children: true, texture: true, baseTexture: true});
    } catch(_) {}
    model = null;
    modelReady = false;
  }

  if (!path) { postToFlutter('modelUnloaded', {}); return; }

  currentModelPath = path;
  modelScale = scale || 0.16;

  try {
    const { Live2DModel } = PIXI.live2d;
    Live2DModel.from(path, {
      onError: function(err) { console.warn('Live2D:', err); },
      autoInteract: false
    }).then(function(l2d) {
      model = l2d;
      model.anchor.set(0.5, 0.5);
      updateModelTransform();
      app.stage.addChild(model);
      modelReady = true;
      postToFlutter('modelLoaded', {path: path});

      if (model.internalModel.motionManager) {
        model.internalModel.motionManager.startRandomMotion('Idle');
      }
    }).catch(function(err) {
      postToFlutter('modelError', {error: String(err)});
    });
  } catch(err) {
    postToFlutter('modelError', {error: String(err)});
  }
}

function updateModelTransform() {
  if (!model || !app) return;
  model.x = modelX * app.renderer.width;
  model.y = modelY * app.renderer.height;
  model.scale.set(modelScale, modelScale);
}

// ─── Flutter API ───
function setModelPosition(xPercent, yPercent) {
  modelX = xPercent / 100;
  modelY = yPercent / 100;
  updateModelTransform();
}
function setModelScale(scale) { modelScale = scale; updateModelTransform(); }
function setMouseTracking(enabled) { mouseTracking = enabled; }
function setEyeTarget(ox, oy) {
  if (!modelReady || !model) return;
  try {
    const core = model.internalModel.coreModel;
    core.setParameterValueById('ParamAngleX', ox * 30);
    core.setParameterValueById('ParamAngleY', oy * 30);
    core.setParameterValueById('ParamEyeBallX', ox);
    core.setParameterValueById('ParamEyeBallY', oy);
  } catch(_) {}
}
function setMouthOpen(value) {
  if (!modelReady || !model) return;
  try { model.internalModel.coreModel.setParameterValueById('ParamMouthOpenY', value); } catch(_) {}
}
function setExpression(expression) {
  if (!modelReady || !model) return;
  try { model.internalModel.motionManager.expressionManager.setExpression(expression); } catch(_) {}
}

// ─── Chat dialog ───
function showChatDialog(messages) {
  const d = document.getElementById('chat-dialog');
  const c = document.getElementById('chat-messages');
  c.innerHTML = '';
  if (messages && messages.length) {
    messages.forEach(function(m) {
      const div = document.createElement('div');
      div.className = 'msg ' + (m.role || 'assistant');
      div.innerHTML = '<div class="label">' + (m.role === 'user' ? 'YOU' : 'AI') + '</div><div class="text">' + escapeHtml(m.content || m.text || '') + '</div>';
      c.appendChild(div);
    });
  } else {
    c.innerHTML = '<div class="msg assistant"><div class="text" style="opacity:0.5">No messages...</div></div>';
  }
  d.style.display = 'block';
  if (!d.style.left) { d.style.left = '10px'; d.style.top = '10px'; }
  d.scrollTop = d.scrollHeight;
}
function closeChatDialog() {
  document.getElementById('chat-dialog').style.display = 'none';
  postToFlutter('chatDialogClosed', {});
}
function hideChatDialog() { document.getElementById('chat-dialog').style.display = 'none'; }
function setBackground(hex) {
  document.body.style.background = hex;
  var canvas = document.querySelector('canvas');
  if (canvas) canvas.style.background = hex;
}
function escapeHtml(text) {
  const div = document.createElement('div'); div.textContent = text; return div.innerHTML;
}

// Idle motions
setInterval(function() {
  if (modelReady && model && model.internalModel.motionManager) {
    model.internalModel.motionManager.startRandomMotion('Idle');
  }
}, 15000);

window.addEventListener('load', function() {
  initPixi();
  postToFlutter('rendererReady', {});
  // Auto-load model from query params (for native overlay)
  if (window.__initialModel) {
    setTimeout(function() {
      loadModel(window.__initialModel, modelScale, modelX * 100, modelY * 100);
    }, 500);
  }
});
</script>
</body>
</html>
