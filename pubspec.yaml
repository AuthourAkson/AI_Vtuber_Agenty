name: ai_vtuber_agent
description: AI VTuber Agent - Local AI-powered virtual YouTuber desktop app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  flutter_markdown: ^0.7.7+1
  # LaTeX math rendering
  flutter_math_fork: ^0.7.2
  # bitsdojo_window for modern frameless windows with native buttons
  bitsdojo_window: ^0.1.6
  # flutter_acrylic for Windows acrylic/mica blur effects
  flutter_acrylic: ^1.1.4
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  file_picker: ^11.0.2
  path_provider: ^2.1.3
  crypto: ^3.0.3
  uuid: ^4.4.0
  intl: ^0.20.2
  path: ^1.9.0
  shared_preferences: ^2.3.2
  mime: ^2.0.0
  audioplayers: ^6.7.0
  record: ^6.2.0
  flutter_audio_capture: 1.1.12
  flutter_inappwebview: ^6.0.0
  ffi: ^2.1.0
  desktop_multi_window: ^0.3.0
  window_manager: ^0.5.1
  # WenzAgent multi-agent SDK
  wenzagent:
    path: D:/wenzagent-1.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/live2d/
    - assets/vrm/
    - assets/vrm/lib/
    - assets/vrm/lib/loaders/
    - assets/vrm/lib/controls/
    - assets/vrm/lib/utils/
    - assets/vrm/lib/three-vrm/lib/
    - assets/vrm/lib/three-vrm-animation/lib/
    - assets/python/
    - assets/data/


