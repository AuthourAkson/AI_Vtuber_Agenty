name: ai_vtuber_agent
description: AI VTuber Agent - Local AI-powered virtual YouTuber desktop app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  # 建议使用 flutter_markdown_plus，或者确保版本最新以避免 discontinued 警告
  flutter_markdown: ^0.7.7+1 
  window_manager: ^0.3.9
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  file_picker: ^8.3.7
  path_provider: ^2.1.3
  crypto: ^3.0.3
  uuid: ^4.4.0
  intl: ^0.19.0
  path: ^1.9.0
  shared_preferences: ^2.3.2
  mime: ^1.0.6
  audioplayers: ^6.1.0
  # 关键点：升级到 6.x 版本以解决 record_linux 的编译接口冲突
  record: ^6.2.0
  # 修复版本冲突，使用 1.1.12
  flutter_audio_capture: 1.1.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/