name: ai_vtuber_agent
description: AI VTuber Agent - Local AI-powered virtual YouTuber desktop app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_markdown: ^0.7.2
  window_manager: ^0.3.9
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  file_picker: ^8.0.3
  path_provider: ^2.1.3
  crypto: ^3.0.3
  uuid: ^4.4.0
  intl: ^0.19.0
  path: ^1.9.0
  shared_preferences: ^2.3.2
  mime: ^1.0.6
  audioplayers: ^6.1.0
  record: ^5.1.2
  flutter_audio_capture: ^1.1.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
